name: Test invalid App Store Connect credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Generate a throwaway EC P-256 key (valid format, not registered with Apple)
        id: key
        run: |
          set -e
          KEY_B64="$(openssl ecparam -name prime256v1 -genkey -noout | openssl pkcs8 -topk8 -nocrypt | base64 -w0)"
          echo "::add-mask::$KEY_B64"
          echo "content=$KEY_B64" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        continue-on-error: true
        with:
          appstore-connect-api-issuer-id: 00000000-0000-0000-0000-000000000000
          appstore-connect-api-key-id: ABCDEFGHIJ
          appstore-connect-api-key-content: ${{ steps.key.outputs.content }}
          profile-types: |
            IOS_APP_DEVELOPMENT
      - name: Assert action failed and produced no profiles
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PROFILES: ${{ steps.action.outputs.profiles }}
        run: |
          echo "outcome: $OUTCOME"
          echo "profiles: $PROFILES"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure with unauthorized credentials, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$PROFILES" ]; then
            echo "FAIL: expected no profiles output"
            exit 1
          fi
          if [ -d "$HOME/Library/MobileDevice/Provisioning Profiles" ] && \
             [ -n "$(ls -A "$HOME/Library/MobileDevice/Provisioning Profiles" 2>/dev/null)" ]; then
            echo "FAIL: provisioning profiles were written unexpectedly"
            exit 1
          fi
          echo "PASS"
