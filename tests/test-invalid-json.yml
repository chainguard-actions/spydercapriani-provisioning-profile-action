name: Test invalid appstore-connect-json
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          appstore-connect-json: 'this is not json {'
      - name: Assert action failed and produced no output
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PROFILES: ${{ steps.action.outputs.profiles }}
        run: |
          echo "outcome: $OUTCOME"
          echo "profiles: $PROFILES"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for malformed JSON, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$PROFILES" ]; then
            echo "FAIL: expected empty profiles output"
            exit 1
          fi
          echo "PASS"
