name: Test well-formed but unauthorized key fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Generate a throwaway ES256 private key
        id: key
        run: |
          openssl ecparam -name prime256v1 -genkey -noout -out "$RUNNER_TEMP/key.pem"
          openssl pkcs8 -topk8 -nocrypt -in "$RUNNER_TEMP/key.pem" -out "$RUNNER_TEMP/key.p8"
          KEY_B64="$(base64 -w0 "$RUNNER_TEMP/key.p8")"
          echo "::add-mask::$KEY_B64"
          JSON="{\"keyId\":\"ABC123DEFG\",\"issuerId\":\"00000000-0000-0000-0000-000000000000\",\"keyContent\":\"$KEY_B64\",\"audience\":\"AppStore\"}"
          echo "json=$JSON" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        continue-on-error: true
        with:
          appstore-connect-json: ${{ steps.key.outputs.json }}
          profile-types: |
            IOS_APP_DEVELOPMENT
            IOS_APP_STORE
      - name: Assert action failed without producing profiles
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PROFILES: ${{ steps.action.outputs.profiles }}
        run: |
          echo "outcome: $OUTCOME"
          echo "profiles: $PROFILES"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure with an unregistered App Store Connect key"
            exit 1
          fi
          if [ -n "$PROFILES" ]; then
            echo "FAIL: expected no profiles output"
            exit 1
          fi
          echo "PASS"
