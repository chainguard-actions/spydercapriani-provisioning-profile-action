name: Test invalid private key fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          # keyContent is base64 of "not a real private key"
          appstore-connect-json: '{"keyId":"ABC123","issuerId":"00000000-0000-0000-0000-000000000000","keyContent":"bm90IGEgcmVhbCBwcml2YXRlIGtleQ==","audience":"Enterprise"}'
          profile-types: |
            MAC_APP_DEVELOPMENT
      - name: Assert action failed on invalid private key
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PROFILES: ${{ steps.action.outputs.profiles }}
        run: |
          echo "outcome: $OUTCOME"
          echo "profiles: $PROFILES"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure on invalid private key"
            exit 1
          fi
          if [ -n "$PROFILES" ]; then
            echo "FAIL: expected no profiles output"
            exit 1
          fi
          echo "PASS"
