name: Test missing appstore-connect-json fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert action failed without credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PROFILES: ${{ steps.action.outputs.profiles }}
        run: |
          echo "outcome: $OUTCOME"
          echo "profiles: $PROFILES"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when appstore-connect-json is missing"
            exit 1
          fi
          if [ -n "$PROFILES" ]; then
            echo "FAIL: expected no profiles output"
            exit 1
          fi
          echo "PASS"
