name: Test malformed API key content
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          appstore-connect-api-issuer-id: 00000000-0000-0000-0000-000000000000
          appstore-connect-api-key-id: ABCDEFGHIJ
          appstore-connect-api-key-content: bm90LWEtcmVhbC1rZXk=
      - name: Assert action failed and produced no profiles
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PROFILES: ${{ steps.action.outputs.profiles }}
        run: |
          echo "outcome: $OUTCOME"
          echo "profiles: $PROFILES"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure with malformed key, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$PROFILES" ]; then
            echo "FAIL: expected no profiles output"
            exit 1
          fi
          echo "PASS"
